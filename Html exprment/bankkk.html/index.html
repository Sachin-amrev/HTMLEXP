<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Bank Balance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .balance {
            font-size: 30px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h1>My Bank Balance</h1>
    <p class="balance" id="balance">₹10,000</p>

    <script>
        let balance = 10000; // Initial balance
        setInterval(() => {
            balance += Math.floor(Math.random() * 20000) + 5000; // Zyada fast increase
            document.getElementById("balance").innerText = "₹" + balance;
        }, 100); // Har 100ms me update hoga (10x speed)
    </script>

</body>
</html>
