<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Bank Balance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .balance {
            font-size: 30px;
            font-weight: bold;
            color: green;
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>My Bank Balance</h1>
    <p class="balance" id="balance">₹10,000</p>

    <script>
        let balance = 10000; // Initial balance
        let maxBalance = 50000000; // Max Limit ₹5 Crore
        let transactionSpeed = 100; // Speed (milliseconds)

        function updateBalance() {
            if (balance >= maxBalance) {
                clearInterval(interval); // Stop when max limit is reached
            } else {
                let deposit = Math.floor(Math.random() * 100000) + 50000; // Random Deposit Amount (₹50K - ₹1Lakh)
                balance += deposit;
                document.getElementById("balance").innerText = "₹" + balance.toLocaleString();
            }
        }

        let interval = setInterval(updateBalance, transactionSpeed); // Auto-Run with Speed
    </script>

</body>
</html>
