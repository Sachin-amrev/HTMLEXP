<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Game Slot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
        }
        .top-bar {
            padding: 15px;
            background: #333;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }
        .balance {
            font-size: 20px;
            font-weight: bold;
            color: gold;
            border: 2px solid gold;
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(255, 215, 0, 0.1);
            display: inline-block;
        }
        .deposit-btn {
            background: gold;
            color: black;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-left: 10px;
            cursor: pointer;
        }
        .bet-section {
            margin-top: 80px;
        }
        .select-box {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid white;
            background: #333;
            color: white;
        }
        .btn {
            background: gold;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .slot-container {
            margin-top: 50px;
        }
        .slot-title {
            font-size: 40px;
            font-weight: bold;
            color: gold;
        }
        .slot-machine {
            width: 300px;
            height: 150px;
            background: black;
            border: 5px solid gold;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 40px;
            font-weight: bold;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 10px auto;
        }
        #result {
            font-size: 25px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="balance">💰 Balance: ₹<span id="balance">1000</span></div>
        <button class="deposit-btn" onclick="deposit()">💰 Deposit</button>
    </div>

    <!-- Bet Amount Selection (Spin ke upar) -->
    <div class="bet-section">
        <h2>💵 Select Bet Amount</h2>
        <select id="betAmount" class="select-box">
            <option value="100">₹100</option>
            <option value="500">₹500</option>
            <option value="1000">₹1000</option>
            <option value="5000">₹5000</option>
            <option value="10000">₹10,000</option>
            <option value="50000">₹50,000</option>
            <option value="100000">₹1,00,000</option>
        </select>
    </div>

    <div class="slot-container">
        <div class="slot-title">Casino Game Slot</div>

        <div class="slot-machine">
            <span id="slot1">🎰</span>
            <span id="slot2">🎰</span>
            <span id="slot3">🎰</span>
        </div>

        <h2 id="result"></h2>
        <button class="btn" onclick="spinSlot()">Spin</button>
    </div>

    <script>
        let balance = 1000;

        function updateBalance() {
            document.getElementById("balance").innerText = balance;
        }

        function deposit() {
            let amount = prompt("Enter deposit amount (Min ₹100):");
            if (amount && amount >= 100) {
                balance += parseInt(amount);
                updateBalance();
                alert("Deposit Successful!");
            } else {
                alert("Minimum deposit is ₹100!");
            }
        }

        function spinSlot() {
            let betAmount = parseInt(document.getElementById("betAmount").value);
            
            if (betAmount > balance) {
                alert("Insufficient Balance! Deposit First.");
                return;
            }

            balance -= betAmount;
            updateBalance();

            let symbols = ["🍒", "🍋", "🍊", "🍉", "⭐", "💎"];
            let slot1 = symbols[Math.floor(Math.random() * symbols.length)];
            let slot2 = symbols[Math.floor(Math.random() * symbols.length)];
            let slot3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById("slot1").innerText = slot1;
            document.getElementById("slot2").innerText = slot2;
            document.getElementById("slot3").innerText = slot3;

            let resultText = document.getElementById("result");

            if (slot1 === slot2 && slot2 === slot3) {
                let winAmount = betAmount * 2;
                balance += winAmount;
                resultText.innerText = "🎉 Congratulations! You Won ₹" + winAmount + " 🎉";
            } else {
                resultText.innerText = "❌ Try Again!";
            }
        }
    </script>

</body>
</html>
