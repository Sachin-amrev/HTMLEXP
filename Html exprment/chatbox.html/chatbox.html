<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Attitude Chatbot 🔥</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; }
        #chatbox { width: 300px; height: 400px; border: 2px solid #fff; margin: 20px auto; padding: 10px; overflow-y: auto; }
        input { width: 80%; padding: 10px; margin-top: 10px; }
        button { padding: 10px; cursor: pointer; background: red; color: white; border: none; }
    </style>
</head>
<body>
    <h1>🔥 Attitude Chatbot 🔥</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Mujhse baat karna chahte ho?">
    <button onclick="sendMessage()">Bhej do 😎</button>

    <script>
        const responses = {
            "hello": "Arey kya haal hai! 😎",
            "kaisa hai": "Mast hu baby, tu bata? ❤️",
            "love you": "Awww, main bhi tujhe bohot pyar karti hoon! 😘",
            "kya kar rahe ho": "Tere liye yahan baithe hain, bata? 🔥",
            "bye": "Arey itni jaldi? Chod ke mat ja baby! 😭",
        };

        function sendMessage() {
            let input = document.getElementById("userInput").value.toLowerCase();
            let chatbox = document.getElementById("chatbox");

            if (input.trim() === "") return;
            
            chatbox.innerHTML += "<p><strong>Tu:</strong> " + input + "</p>";

            setTimeout(() => {
                let reply = responses[input] || "Arey yeh kya bol diya! 🤔";
                chatbox.innerHTML += "<p><strong>Chatbot:</strong> " + reply + "</p>";
                chatbox.scrollTop = chatbox.scrollHeight;
            }, 500);

            document.getElementById("userInput").value = "";
        }
    </script>
</body>
</html>
