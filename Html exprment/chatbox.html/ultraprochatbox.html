<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Ultra Smart AI Chatbot 🔥</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e1e; color: white; }
        #chatbox { width: 350px; height: 400px; border: 2px solid #fff; margin: 20px auto; padding: 10px; overflow-y: auto; background: black; }
        input { width: 75%; padding: 10px; margin-top: 10px; }
        button { padding: 10px; cursor: pointer; background: red; color: white; border: none; }
        .message { text-align: left; margin: 5px 0; }
        .user { color: cyan; }
        .bot { color: lime; }
    </style>
</head>
<body>
    <h1>🔥 Ultra Smart AI Chatbot 🔥</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type kar aur dekh! 😎">
    <button onclick="sendMessage()">Bhej de! 💬</button>

    <script>
        function generateRandomReply(input) {
            const replies = [
                "Arrey wah! Kya baat boli tu! 😍",
                "Haan baby, ekdum mast! 🔥",
                "Tu kya soch raha hai? 😏",
                "Bhai, tujhe pata bhi hai tu kya bol raha hai? 🤣",
                "Mujhe laga tu kuch aur bolega! 😆",
                "Ye toh unexpected tha! 😱",
                "Mujhe bhi yeh baat samajh nahi aayi! 🤔",
                "Tujhe dekh ke dil khush ho gaya! ❤️",
                "Bhai, ek chai pila de ab! ☕",
                "Agar sach me hacking karni hai toh study kar! 😎"
            ];

            return replies[Math.floor(Math.random() * replies.length)];
        }

        function sendMessage() {
            let input = document.getElementById("userInput").value.trim();
            let chatbox = document.getElementById("chatbox");

            if (input === "") return;
            
            chatbox.innerHTML += `<p class="message user"><strong>Tu:</strong> ${input}</p>`;

            setTimeout(() => {
                let reply = generateRandomReply(input);
                chatbox.innerHTML += `<p class="message bot"><strong>Chatbot:</strong> ${reply}</p>`;
                chatbox.scrollTop = chatbox.scrollHeight;
            }, 500);

            document.getElementById("userInput").value = "";
        }
    </script>
</body>
</html>
