<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <input type="text" id="phone" placeholder="Enter Mobile Number">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Continue</button>

        <p>New User? <a href="register.html">Create Account</a></p>
    </div>

    <script>
        function login() {
            let phone = document.getElementById('phone').value;
            let password = document.getElementById('password').value;

            let storedPhone = localStorage.getItem('userPhone');
            let storedPassword = localStorage.getItem('userPassword');

            if (phone === storedPhone && password === storedPassword) {
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid login! Please check your details.");
            }
        }
    </script>
</body>
</html>
