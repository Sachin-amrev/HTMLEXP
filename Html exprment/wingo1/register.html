<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Win11 Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="logo">Win11 Club</h1>
        <div class="register-box">
            <h2>Register</h2>
            <p>Please register by phone number</p>
            
            <div class="input-group">
                <label>Phone Number</label>
                <div class="phone-input">
                    <select id="countryCode">
                        <option value="+91">🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                        <option value="+971">🇦🇪 +971</option>
                    </select>
                    <input type="text" id="phoneNumber" placeholder="Enter phone number">
                </div>
            </div>

            <div class="input-group">
                <label>Set Password</label>
                <div class="password-input">
                    <input type="password" id="password" placeholder="Set password">
                    <span onclick="togglePassword('password')">👁️</span>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-input">
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                    <span onclick="togglePassword('confirmPassword')">👁️</span>
                </div>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="terms">
                <label for="terms">I have read and agree to <a href="#">Privacy Agreement</a></label>
            </div>

            <button onclick="register()">Register</button>
            
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
        function register() {
            let countryCode = document.getElementById('countryCode').value;
            let phoneNumber = document.getElementById('phoneNumber').value;
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirmPassword').value;
            let terms = document.getElementById('terms').checked;

            if (phoneNumber.length < 10 || password.length < 4) {
                alert("Enter valid phone number & password!");
                return;
            }
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }
            if (!terms) {
                alert("Please accept the Privacy Agreement!");
                return;
            }

            let fullPhoneNumber = countryCode + phoneNumber;

            // Save details to localStorage
            localStorage.setItem("userPhone", fullPhoneNumber);
            localStorage.setItem("userPassword", password);

            alert("Account Created Successfully!");
            window.location.href = "login.html";
        }

        function togglePassword(id) {
            let input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
        }
    </script>
</body>
</html>
